table: silver.orders
conflict_columns: [connection_id, source_id]
required: [source_id]
fields:
  source_id: id
  order_number: number
  customer_source_id: customer_id
  status: status
  currency_code: currency
  subtotal_amount: total
  discount_amount: discount_total
  shipping_amount: shipping_total
  tax_amount: total_tax
  gross_amount: total
  total_amount: total
  refunded_amount: $literal:0
  net_amount: total
  source_created_at: date_created_gmt
  source_updated_at: date_modified_gmt
  processed_at: date_paid_gmt
  source_hash: $context.record_hash
defaults:
  subtotal_amount: 0
  discount_amount: 0
  shipping_amount: 0
  tax_amount: 0
  gross_amount: 0
  total_amount: 0
  refunded_amount: 0
  net_amount: 0
foreign_keys:
  customer_id:
    table: silver.customers
    source_path: customer_id
children:
  - table: silver.order_items
    explode: line_items
    conflict_columns: [connection_id, source_id]
    required: [source_id, order_id]
    fields:
      source_id: id
      product_source_id: product_id
      variant_source_id: variation_id
      sku: sku
      title: name
      quantity: quantity
      unit_price: price
      gross_amount: subtotal
      discount_amount: $literal:0
      tax_amount: total_tax
      net_amount: total
      currency_code: $parent.currency
    defaults:
      quantity: 0
      unit_price: 0
      gross_amount: 0
      discount_amount: 0
      tax_amount: 0
      net_amount: 0
    foreign_keys:
      order_id:
        table: silver.orders
        source_path: $parent.id
      product_id:
        table: silver.products
        source_path: product_id
      variant_id:
        table: silver.product_variants
        source_path: variation_id

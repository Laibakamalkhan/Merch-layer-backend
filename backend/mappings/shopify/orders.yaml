table: silver.orders
conflict_columns: [connection_id, source_id]
required: [source_id]
fields:
  source_id: id
  order_number: name
  financial_status: displayFinancialStatus
  fulfillment_status: displayFulfillmentStatus
  currency_code: totalPriceSet.shopMoney.currencyCode
  subtotal_amount: subtotalPriceSet.shopMoney.amount
  discount_amount: totalDiscountsSet.shopMoney.amount
  shipping_amount: totalShippingPriceSet.shopMoney.amount
  tax_amount: totalTaxSet.shopMoney.amount
  gross_amount: totalPriceSet.shopMoney.amount
  total_amount: totalPriceSet.shopMoney.amount
  refunded_amount: $literal:0
  net_amount: totalPriceSet.shopMoney.amount
  source_created_at: createdAt
  source_updated_at: updatedAt
  processed_at: processedAt
  source_hash: $context.record_hash
defaults:
  subtotal_amount: 0
  discount_amount: 0
  shipping_amount: 0
  tax_amount: 0
  gross_amount: 0
  total_amount: 0
  refunded_amount: 0
  net_amount: 0
children:
  - table: silver.order_items
    explode: lineItems.nodes
    conflict_columns: [connection_id, source_id]
    required: [source_id, order_id]
    fields:
      source_id: id
      product_source_id: product.id
      variant_source_id: variant.id
      sku: sku
      title: title
      quantity: quantity
      unit_price: originalUnitPriceSet.shopMoney.amount
      gross_amount: originalTotalSet.shopMoney.amount
      discount_amount: totalDiscountSet.shopMoney.amount
      tax_amount: $literal:0
      net_amount: discountedTotalSet.shopMoney.amount
      currency_code: originalUnitPriceSet.shopMoney.currencyCode
    defaults:
      quantity: 0
      unit_price: 0
      gross_amount: 0
      discount_amount: 0
      tax_amount: 0
      net_amount: 0
    foreign_keys:
      order_id:
        table: silver.orders
        source_path: $parent.id
      product_id:
        table: silver.products
        source_path: product.id
      variant_id:
        table: silver.product_variants
        source_path: variant.id

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-commerce-enterprise"
version = "0.6.0"
description = "Universal multi-store commerce ingestion, medallion analytics and RAG/AI platform prototype."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1.0",
  "pydantic>=2.10,<3.0",
  "PyYAML>=6.0,<7.0",
  "psycopg[binary,pool]>=3.2,<4.0",
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "pypdf>=5.0,<7.0",
  "python-dotenv>=1.0,<2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["commerce_connector*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
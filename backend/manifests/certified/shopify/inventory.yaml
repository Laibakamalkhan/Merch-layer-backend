protocol: graphql
method: POST
path: /admin/api/2026-07/graphql.json
graphql_query: |
  query InventoryItems($cursor: String) {
    inventoryItems(first: 100, after: $cursor) {
      nodes {
        id
        sku
        createdAt
        updatedAt
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
response:
  format: json
  records_path: data.inventoryItems.nodes
pagination:
  type: graphql_cursor
  records_path: data.inventoryItems.nodes
  cursor_variable: cursor
  cursor_path: data.inventoryItems.pageInfo.endCursor
  has_next_path: data.inventoryItems.pageInfo.hasNextPage
